<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vydeje – PRG WMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wms_nav.js"></script>
<script src="wms_flow.js"></script>
<script src="wms_dc.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="wms_docimport.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#f0f2f5;--surface:#fff;--border:#e2e6ed;--accent:#0a7c4e;--accent-light:#e8f7f1;--danger:#c0392b;--danger-light:#fdecea;--warning:#e67e22;--warning-light:#fef3e8;--info:#2980b9;--info-light:#eaf4fb;--text:#1a1d27;--muted:#7a8090;--shadow:0 2px 12px rgba(0,0,0,0.07);--sidebar-w:220px;}
*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;transition:opacity 0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}.btn:active{opacity:0.8;}.btn-primary{background:var(--accent);color:#fff;}.btn-secondary{background:var(--bg);color:var(--muted);border:1.5px solid var(--border);}.btn-danger{background:var(--danger);color:#fff;}.btn-warning{background:var(--warning);color:#fff;}.btn-info{background:var(--info);color:#fff;}.btn-sm{padding:6px 12px;font-size:12px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}.badge-green{background:var(--accent-light);color:var(--accent);}.badge-orange{background:var(--warning-light);color:var(--warning);}.badge-red{background:var(--danger-light);color:var(--danger);}.badge-blue{background:var(--info-light);color:var(--info);}.badge-gray{background:#f0f2f5;color:var(--muted);}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:20px;}.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}.card-header h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13px;}thead{background:#f8f9fb;}th{padding:9px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;}td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}tbody tr:last-child td{border-bottom:none;}tbody tr:hover{background:#fafbfc;}.empty-row td{text-align:center;color:var(--muted);padding:28px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}.form-row.single{grid-template-columns:1fr;}.form-row.triple{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:5px;}.form-group label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;background:#fff;}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);}.form-group textarea{resize:vertical;min-height:70px;}
.form-section{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}.modal-box{background:var(--surface);border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto;}.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}.modal-header h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;}.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}.modal-body{padding:18px 22px;}.modal-footer{padding:12px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:#0a7c4e;display:flex;flex-direction:column;z-index:50;transition:transform 0.25s ease;}.sidebar-logo{padding:20px 18px 14px;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:1.5px;border-bottom:1px solid rgba(255,255,255,0.15);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;}.sidebar-logo span{font-size:11px;font-weight:400;opacity:0.7;width:100%;letter-spacing:0;}#sidebar-close-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:0.8;display:none;}nav{flex:1;padding:10px 0;overflow-y:auto;}.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;color:rgba(255,255,255,0.75);cursor:pointer;font-size:14px;font-weight:500;transition:background 0.15s,color 0.15s;border-left:3px solid transparent;}.nav-item:hover{background:rgba(255,255,255,0.1);color:#fff;}.nav-item.active{background:rgba(255,255,255,0.15);color:#fff;border-left-color:#fff;}.nav-icon{font-size:17px;width:22px;text-align:center;}.sidebar-user{padding:12px 18px;border-top:1px solid rgba(255,255,255,0.15);font-size:12px;color:rgba(255,255,255,0.7);display:flex;flex-direction:column;gap:4px;}.sidebar-user strong{color:#fff;font-size:13px;}.sidebar-user button{background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:11px;margin-top:4px;}
#main{margin-left:var(--sidebar-w);min-height:100vh;}.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);position:sticky;top:0;z-index:40;}.topbar h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;flex:1;}.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}.hamburger-btn{display:inline-flex;align-items:center;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:4px 8px;margin-right:4px;border-radius:6px;}.content{padding:24px;max-width:1100px;}#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:49;}
.back-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:0;}.tab{padding:11px 20px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:color 0.15s;}.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.items-table td input,.items-table td select{padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;width:100%;outline:none;font-family:'Inter',sans-serif;background:#fff;}.items-table td input:focus,.items-table td select:focus{border-color:var(--accent);}
.required-mark{color:var(--danger);margin-left:2px;}
#toast{position:fixed;bottom:24px;right:24px;background:#1a1d27;color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:300px;}#toast.show{opacity:1;}
@media(min-width:901px){.hamburger-btn{display:none;}#sidebar-close-btn{display:none !important;}}
@media(max-width:900px){:root{--sidebar-w:0px;}#sidebar{transform:translateX(-220px);width:220px;}#sidebar.open{transform:translateX(0);}#sidebar-close-btn{display:block !important;}#main{margin-left:0;}.content{padding:14px;}.topbar{padding:11px 14px;}.form-row.triple{grid-template-columns:1fr 1fr;}}
/* mobilní zobrazení – sjednoceno s Inventory Tool */
@media(max-width:900px){
body{overflow-x:hidden;}
#main{min-width:0;max-width:100%;}
.content{padding:12px !important;min-width:0;max-width:100%;}
.card{min-width:0;max-width:100%;}
.topbar{flex-wrap:wrap;gap:8px;padding:10px 12px !important;}
.topbar h2{font-size:19px !important;min-width:0;flex:1 1 auto;}
.topbar-actions{flex-wrap:wrap;gap:6px;margin-left:auto;}
#last-refresh{display:none;}
#theme-popover{right:8px !important;max-width:calc(100vw - 16px);}
.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important;}
.two-col{grid-template-columns:minmax(0,1fr) !important;}
.stat-grid>*,.two-col>*{min-width:0;}
.form-row{grid-template-columns:1fr !important;}
}
</style></head><body>
<div id="auth-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a7c4e,#075c3a)">
  <div style="background:#fff;border-radius:16px;padding:36px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.2)">
    <h1 style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:#0a7c4e;margin-bottom:4px">&#128230; PRG WMS</h1>
    <p style="font-size:13px;color:#7a8090;margin-bottom:20px">Warehouse Management System</p>
    <div id="auth-msg" style="font-size:13px;color:#c0392b;min-height:18px;margin-bottom:8px"></div>
    <input id="login-email" type="email" placeholder="E-mail" style="width:100%;padding:11px 14px;margin-bottom:10px;border:1.5px solid #e2e6ed;border-radius:8px;font-size:14px;outline:none">
    <input id="login-pass" type="password" placeholder="Heslo" style="width:100%;padding:11px 14px;margin-bottom:14px;border:1.5px solid #e2e6ed;border-radius:8px;font-size:14px;outline:none">
    <button onclick="doLogin()" style="width:100%;padding:12px;background:#0a7c4e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">Přihlásit se</button>
  </div>
</div>
<div id="app" style="display:none">
  <div id="sidebar">
    <div class="sidebar-logo">PRG WMS<span>Warehouse Management</span><button onclick="toggleSidebar()" id="sidebar-close-btn">&#x2715;</button></div>
    <nav id="wms-nav" data-active="deliveries"></nav>
    <div class="sidebar-user"><strong id="sidebar-user-name">-</strong><span id="sidebar-user-role" class="badge badge-gray"></span><button onclick="doLogout()">Odhlásit se</button></div>
  </div>
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div id="main">
<div class="topbar"><button class="hamburger-btn" onclick="toggleSidebar()">&#9776;</button><h2>📤 Výdejové doklady</h2>
<div class="topbar-actions"><a href="wms_delivery.html" class="btn btn-primary btn-sm">+ Nový doklad</a></div></div>
<div class="content">
  <div class="card">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="search" type="text" placeholder="Hledat číslo, klienta…" oninput="filterDocs()" style="flex:1;min-width:150px;padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none">
      <select id="f-status" onchange="filterDocs()" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"></select>
      <select id="f-client" onchange="filterDocs()" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"><option value="">Všichni klienti</option></select>
      <select id="f-special" onchange="filterDocs()" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"><option value="">Bez příznaku i s ním</option><option value="preorder">Předobjednávka</option><option value="hold">Hold</option></select>
      <span id="f-info" style="font-size:12px;color:var(--muted)"></span>
      <span id="sel-bar" style="display:none;gap:6px;align-items:center"><b id="sel-n" style="font-size:13px"></b><button class="btn btn-primary btn-sm" onclick="makeWave()">🌊 Vytvořit vlnu</button><button class="btn btn-secondary btn-sm" onclick="assignSel()">👤 Přiřadit</button><button class="btn btn-secondary btn-sm" onclick="clearSel()">✕</button></span>
    </div>
    <div style="overflow-x:auto;">
    <table><thead><tr><th style="width:30px"><input type="checkbox" id="sel-all" onchange="selAll(this.checked)"></th><th>Číslo</th><th>Klient</th><th>Příznak</th><th>DC</th><th>Stav</th><th>Průběh</th><th>Odjezd</th><th>Vytvořil</th><th>Akce</th></tr></thead>
    <tbody id="tbody"><tr class="empty-row"><td colspan="10">Načítám…</td></tr></tbody></table>
    </div>
  </div>
</div>
</div>
</div>
<div id="toast"></div>
<script src="wms_auth.js"></script>
<script>

var SEL={},NAMES={},WAVES={},data=[],prog={},KIND='delivery',firstLoad=true;
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function afterLogin(){
  document.getElementById('f-status').innerHTML=PRG_FLOW.statusOptions(KIND,true);
  try{var fs=localStorage.getItem('prg_list_status_'+KIND);document.getElementById('f-status').value=fs!=null?fs:'open';}catch(e){document.getElementById('f-status').value='open';}
  var cr=await supa.from('clients').select('id,name').order('name');
  var fc=document.getElementById('f-client');(cr.data||[]).forEach(function(c){fc.innerHTML+='<option value="'+c.id+'">'+esc(c.name)+'</option>';});
  load();
  if(window.PRG_DOCIMPORT)PRG_DOCIMPORT.attach({kind:KIND,supa:supa,user:function(){return currentUser;},reload:load});
}
async function load(){
  var q=supa.from('deliveries').select('*,warehouses(name,code),profiles(name),clients(name)').order('created_at',{ascending:false}).limit(2000);
  if(window.PRG_DC)q=PRG_DC.apply(q,'warehouse_id');
  var res=await q;
  if(res.error){document.getElementById('tbody').innerHTML='<tr class="empty-row"><td colspan="10">Chyba: '+esc(res.error.message)+'</td></tr>';return;}
  data=res.data||[];
  var open=data.filter(function(r){return PRG_FLOW.isOpen(KIND,r.status);}).map(function(r){return r.id;});
  var pn=await supa.from('profiles').select('id,name');(pn.data||[]).forEach(function(x){NAMES[x.id]=x.name;});
  if(KIND==='delivery'){var wv=await supa.from('waves').select('*').order('created_at',{ascending:false}).limit(200);(wv.data||[]).forEach(function(w){WAVES[w.id]=w;});}
  prog=await PRG_FLOW.fetchProgress(supa,KIND,open.length?open:data.slice(0,200).map(function(r){return r.id;}));
  filterDocs();
}
function when(v){if(!v)return '–';var d=new Date(v);return d.toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});}
function renderDocs(d){
  var tb=document.getElementById('tbody');
  if(!d.length){tb.innerHTML='<tr class="empty-row"><td colspan="10">Žádné doklady</td></tr>';return;}
  tb.innerHTML=d.map(function(r){
    var wn=(r.warehouses&&(r.warehouses.code||r.warehouses.name))||'–',cn=(r.clients&&r.clients.name)||'–',un=(r.profiles&&r.profiles.name)||'–';
    var st=PRG_FLOW.norm(KIND,r.status);
    return '<tr><td><input type="checkbox" class="sel" value="'+r.id+'" onchange="selUpd()"'+(SEL[r.id]?' checked':'')+'></td><td><a href="wms_delivery.html?id='+r.id+'" style="font-weight:700;color:var(--accent);text-decoration:none;font-family:\'JetBrains Mono\',monospace">'+esc(r.delivery_number)+'</a>'+PRG_FLOW.problemIcon(r)+'</td>'
      +'<td>'+esc(cn)+'</td>'+'<td>'+(r.special_status==='hold'?'<span class="badge badge-red">Hold</span>':r.special_status==='preorder'?'<span class="badge badge-orange">Předobjednávka</span>':'')+'</td>'+'<td>'+esc(wn)+'</td>'
      +'<td>'+PRG_FLOW.badge(KIND,st)+'</td>'
      +'<td style="font-size:12px;color:var(--muted);white-space:nowrap">'+esc(PRG_FLOW.progress(KIND,r,prog[r.id]))+(r.wave_id?'<br>🌊 '+esc((WAVES[r.wave_id]||{}).name||'vlna'):'')+(r.assigned_to?'<br>👤 '+esc(NAMES[r.assigned_to]||''):'')+'</td>'
      +'<td style="font-size:12px;white-space:nowrap">'+when(r.planned_at)+(r.priority==='high'?' <span class="badge badge-red">Vysoká</span>':'')+'</td>'
      +'<td>'+esc(un)+'</td>'
      +'<td><div style="display:flex;gap:4px"><a href="wms_delivery.html?id='+r.id+'" class="btn btn-secondary btn-sm">Detail</a>'
      +(st==='new'?'<button class="btn btn-danger btn-sm" title="Smazat" onclick="del('+r.id+')">&#128465;</button>':'')
      +'</div></td></tr>';
  }).join('');
}
function filterDocs(){
  var q=document.getElementById('search').value.toLowerCase().trim(),s=document.getElementById('f-status').value,c=document.getElementById('f-client').value;
  var sp=document.getElementById('f-special');sp=sp?sp.value:'';
  try{localStorage.setItem('prg_list_status_'+KIND,s);}catch(e){}
  var out=data.filter(function(r){
    var st=PRG_FLOW.norm(KIND,r.status);
    if(s==='open'&&!PRG_FLOW.isOpen(KIND,st))return false;
    if(s==='problem'&&!r.problem)return false;
    if(s&&s!=='open'&&s!=='problem'&&st!==s)return false;
    if(c&&String(r.client_id)!==c)return false;
    if(sp&&r.special_status!==sp)return false;
    if(q){var hay=((r.delivery_number||'')+' '+((r.clients&&r.clients.name)||'')+' '+(r.supplier||'')+' '+(r.note||'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  document.getElementById('f-info').textContent=out.length+' z '+data.length;
  renderDocs(out);
}
function selUpd(){SEL={};document.querySelectorAll('.sel:checked').forEach(function(c){SEL[c.value]=1;});var n=Object.keys(SEL).length,b=document.getElementById('sel-bar');b.style.display=n?'inline-flex':'none';document.getElementById('sel-n').textContent=n+' vybráno';}
function selAll(on){document.querySelectorAll('.sel').forEach(function(c){c.checked=on;});selUpd();}
function clearSel(){selAll(false);document.getElementById('sel-all').checked=false;}
function selIds(){return Object.keys(SEL).map(Number);}
async function assignSel(){var ids=selIds();if(!ids.length)return;var opts=Object.keys(NAMES).map(function(id,i){return (i+1)+' = '+NAMES[id];}).join('\n');
  var c=prompt('Přiřadit '+ids.length+' dokladů komu? Napiš číslo:\n0 = nikomu\n'+opts,'');if(c===null)return;var keys=Object.keys(NAMES),to=Number(c)>0?keys[Number(c)-1]:null;
  if(Number(c)>0&&!to){toast('Neplatná volba');return;}
  var r=await supa.rpc('wms_assign',{p_type:KIND,p_ids:ids,p_to:to,p_user:currentUser.id});if(r.error){toast('❌ '+PRG_FLOW.errMsg(r.error));return;}toast('Přiřazeno');clearSel();load();}
async function makeWave(){var ids=selIds();if(!ids.length)return;var dc=window.PRG_DC&&PRG_DC.currentId();
  var first=data.find(function(x){return x.id===ids[0];});if(dc==null&&first)dc=first.warehouse_id;
  if(data.some(function(x){return SEL[x.id]&&String(x.warehouse_id)!==String(dc);})){toast('Vlna může být jen z jednoho DC');return;}
  var nm=prompt('Název vlny (prázdné = podle času):','');if(nm===null)return;
  var r=await supa.rpc('wms_wave_create',{p_dc:isNaN(Number(dc))?dc:Number(dc),p_ids:ids,p_name:nm||null,p_user:currentUser.id});
  if(r.error){toast('❌ '+PRG_FLOW.errMsg(r.error));return;}
  var d=r.data||{};alert('Vlna: zařazeno '+d.added+' výdejů'+(d.skipped?'\nNezařazeno: '+d.skipped:''));clearSel();load();}
async function del(id){
  var r=data.find(function(x){return x.id===id;});
  if(!r||PRG_FLOW.norm(KIND,r.status)!=='new'){toast('Smazat jde jen doklad ve stavu Nový');return;}
  if(!confirm('Smazat doklad '+r.delivery_number+'?'))return;
  await supa.from('delivery_items').delete().eq('delivery_id',id);
  await supa.from('document_attribute_values').delete().eq('doc_type',KIND).eq('doc_id',id);
  var d=await supa.from('deliveries').delete().eq('id',id).eq('status','new');
  if(d.error){toast('❌ '+PRG_FLOW.errMsg(d.error));}else toast('Smazáno');
  load();
}
</script></body></html>
