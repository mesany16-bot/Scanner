<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SKU Setup – PRG WMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wms_nav.js"></script>
<script src="wms_dc.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#f0f2f5;--surface:#fff;--border:#e2e6ed;--accent:#0a7c4e;--accent-light:#e8f7f1;--danger:#c0392b;--danger-light:#fdecea;--warning:#e67e22;--warning-light:#fef3e8;--info:#2980b9;--info-light:#eaf4fb;--text:#1a1d27;--muted:#7a8090;--shadow:0 2px 12px rgba(0,0,0,0.07);--sidebar-w:220px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;transition:opacity 0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn:active{opacity:0.8;}.btn-primary{background:var(--accent);color:#fff;}.btn-secondary{background:var(--bg);color:var(--muted);border:1.5px solid var(--border);}.btn-danger{background:var(--danger);color:#fff;}.btn-warning{background:var(--warning);color:#fff;}.btn-info{background:var(--info);color:#fff;}.btn-sm{padding:6px 12px;font-size:12px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-green{background:var(--accent-light);color:var(--accent);}.badge-orange{background:var(--warning-light);color:var(--warning);}.badge-red{background:var(--danger-light);color:var(--danger);}.badge-blue{background:var(--info-light);color:var(--info);}.badge-gray{background:#f0f2f5;color:var(--muted);}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:20px;}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-header h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead{background:#f8f9fb;}
th{padding:9px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}tbody tr:hover{background:#fafbfc;}
.empty-row td{text-align:center;color:var(--muted);padding:28px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-row.single{grid-template-columns:1fr;}.form-row.triple{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;background:#fff;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);}
.form-group textarea{resize:vertical;min-height:70px;}
.form-section{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:var(--surface);border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto;}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
.modal-body{padding:18px 22px;}.modal-footer{padding:12px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:#0a7c4e;display:flex;flex-direction:column;z-index:50;transition:transform 0.25s ease;}
.sidebar-logo{padding:20px 18px 14px;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:1.5px;border-bottom:1px solid rgba(255,255,255,0.15);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.sidebar-logo span{font-size:11px;font-weight:400;opacity:0.7;width:100%;letter-spacing:0;}
#sidebar-close-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:0.8;display:none;}
nav{flex:1;padding:10px 0;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;color:rgba(255,255,255,0.75);cursor:pointer;font-size:14px;font-weight:500;transition:background 0.15s,color 0.15s;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,0.1);color:#fff;}
.nav-item.active{background:rgba(255,255,255,0.15);color:#fff;border-left-color:#fff;}
.nav-icon{font-size:17px;width:22px;text-align:center;}
.sidebar-user{padding:12px 18px;border-top:1px solid rgba(255,255,255,0.15);font-size:12px;color:rgba(255,255,255,0.7);display:flex;flex-direction:column;gap:4px;}
.sidebar-user strong{color:#fff;font-size:13px;}
.sidebar-user button{background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:11px;margin-top:4px;}
#main{margin-left:var(--sidebar-w);min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);position:sticky;top:0;z-index:40;}
.topbar h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;flex:1;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.hamburger-btn{display:inline-flex;align-items:center;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:4px 8px;margin-right:4px;border-radius:6px;}
.content{padding:24px;}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:49;}
#toast{position:fixed;bottom:24px;right:24px;background:#1a1d27;color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
#toast.show{opacity:1;}
.back-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
@media(min-width:901px){.hamburger-btn{display:none;}#sidebar-close-btn{display:none !important;}}
@media(max-width:900px){:root{--sidebar-w:0px;}#sidebar{transform:translateX(-220px);width:220px;}#sidebar.open{transform:translateX(0);}#sidebar-close-btn{display:block !important;}#main{margin-left:0;}.content{padding:14px;}.topbar{padding:11px 14px;}}

/* mobilní zobrazení – sjednoceno s Inventory Tool */
@media(max-width:900px){
body{overflow-x:hidden;}
#main{min-width:0;max-width:100%;}
.content{padding:12px !important;min-width:0;max-width:100%;}
.card{min-width:0;max-width:100%;}
.topbar{flex-wrap:wrap;gap:8px;padding:10px 12px !important;}
.topbar h2{font-size:19px !important;min-width:0;flex:1 1 auto;}
.topbar-actions{flex-wrap:wrap;gap:6px;margin-left:auto;}
#last-refresh{display:none;}
#theme-popover{right:8px !important;max-width:calc(100vw - 16px);}
.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important;}
.two-col{grid-template-columns:minmax(0,1fr) !important;}
.stat-grid>*,.two-col>*{min-width:0;}
.form-row{grid-template-columns:1fr !important;}
}
</style>
</head>
<body>
<div id="session-check" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a7c4e,#075c3a)">
  <div style="color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;opacity:0.85;">Načítám…</div>
</div>
<div id="auth-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a7c4e,#075c3a)">
  <div style="background:#fff;border-radius:16px;padding:36px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.2)">
    <h1 style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:#0a7c4e;margin-bottom:4px">📦 PRG WMS</h1>
    <p style="font-size:13px;color:#7a8090;margin-bottom:20px">Warehouse Management System</p>
    <div id="auth-msg" style="font-size:13px;color:#c0392b;min-height:18px;margin-bottom:8px"></div>
    <input id="login-email" type="email" placeholder="E-mail" style="width:100%;padding:11px 14px;margin-bottom:10px;border:1.5px solid #e2e6ed;border-radius:8px;font-size:14px;outline:none">
    <input id="login-pass" type="password" placeholder="Heslo" style="width:100%;padding:11px 14px;margin-bottom:14px;border:1.5px solid #e2e6ed;border-radius:8px;font-size:14px;outline:none">
    <button onclick="doLogin()" style="width:100%;padding:12px;background:#0a7c4e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">Přihlásit se</button>
  </div>
</div>
<div id="app" style="display:none">
  <div id="sidebar">
    <div class="sidebar-logo">PRG WMS<span>Warehouse Management</span><button onclick="toggleSidebar()" id="sidebar-close-btn">✕</button></div>
    <nav id="wms-nav" data-active="stock"></nav>
    <div class="sidebar-user">
      <strong id="sidebar-user-name">–</strong>
      <span id="sidebar-user-role" class="badge badge-gray"></span>
      <button onclick="doLogout()">Odhlásit se</button>
    </div>
  </div>
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div id="main">
    
<div class="topbar"><button class="hamburger-btn" onclick="toggleSidebar()">☰</button><h2>🏷️ SKU Setup</h2><div class="topbar-actions"><button class="btn btn-primary btn-sm" onclick="openModal()">+ Nové SKU</button></div></div>
<div class="content">
  <div class="card">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap">
      <input id="search" type="text" placeholder="Hledat SKU, popis, EAN, kategorie…" oninput="filter()" style="flex:1;min-width:150px;padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none">
      <select id="f-wh" onchange="filter()" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"><option value="">Všechna DC</option></select>
      <select id="f-cl" onchange="filter()" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"><option value="">Všichni klienti</option></select>
    </div>
    <div style="overflow-x:auto;">
    <table><thead><tr><th>SKU</th><th>Popis</th><th>EAN</th><th>Kategorie</th><th>Klient</th><th>DC</th><th style="text-align:right">Ks / paleta</th><th>Typ palety</th><th style="text-align:right">Min.</th><th style="text-align:right">Na skladě</th><th>Akce</th></tr></thead>
    <tbody id="tbody"><tr class="empty-row"><td colspan="11">Načítám…</td></tr></tbody></table>
    </div>
  </div>
</div>
<div class="modal-backdrop" id="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-header"><h3 id="modal-title">Nové SKU</h3><button class="modal-close" onclick="closeModal('modal')">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><div class="form-group"><label>SKU *</label><input id="f-sku" type="text" placeholder="Kód položky"></div><div class="form-group"><label>EAN</label><input id="f-ean" type="text"></div></div>
      <div class="form-row single"><div class="form-group"><label>Popis</label><input id="f-desc" type="text"></div></div>
      <div class="form-row"><div class="form-group"><label>Kategorie</label><input id="f-cat" type="text"></div><div class="form-group"><label>Dodavatel</label><input id="f-sup" type="text"></div></div>
      <div class="form-row"><div class="form-group"><label>Klient</label><select id="f-cl2"><option value="">– bez klienta –</option></select></div><div class="form-group"><label>DC</label><select id="f-wh2"><option value="">– bez DC –</option></select></div></div>
      <div class="form-row"><div class="form-group"><label>Ks na paletu</label><input id="f-upp" type="number" min="0"></div><div class="form-group"><label>Typ palety</label><input id="f-ptype" type="text" placeholder="např. EUR, A, B, C"></div></div>
      <div class="form-row"><div class="form-group"><label>Šířka palety (mm)</label><input id="f-pw" type="number" min="0"></div><div class="form-group"><label>Výška palety (mm)</label><input id="f-ph" type="number" min="0"></div></div>
      <div class="form-row"><div class="form-group"><label>Váha palety (kg)</label><input id="f-pkg" type="number" step="0.1" min="0"></div><div class="form-group"><label>Min. stav (ks)</label><input id="f-min" type="number" value="0"></div></div>
      <div class="form-row"><div class="form-group"><label>Cena (Kč)</label><input id="f-price" type="number" step="0.01"></div><div class="form-group"><label>Foto URL</label><input id="f-photo" type="url"></div></div>
      <div class="form-row single"><div class="form-group"><label>Poznámka</label><textarea id="f-notes"></textarea></div></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('modal')">Zrušit</button><button class="btn btn-primary" onclick="save()">Uložit</button></div>
  </div>
</div>

  </div>
</div>
<div id="toast"></div>
<script>
var SUPA_URL="https://ujvqanqqhmnfxsfeqixc.supabase.co";
var SUPA_KEY="sb_publishable_5o19BnZUEi8j-rU5DDAgBA_HwKB7V-v";
var supa=supabase.createClient(SUPA_URL,SUPA_KEY);
var currentUser=null,currentProfile=null;
async function doLogin(){var email=document.getElementById('login-email').value.trim();var pass=document.getElementById('login-pass').value;if(!email||!pass){document.getElementById('auth-msg').textContent='⚠️ Vyplň e-mail a heslo';return;}document.getElementById('auth-msg').textContent='⏳ Přihlašuji…';var res=await supa.auth.signInWithPassword({email,password:pass});if(res.error){document.getElementById('auth-msg').textContent='❌ '+res.error.message;return;}await onLoggedIn(res.data.user);}
// idle logout
var SESSION_IDLE_MS=2*60*60*1000;var sessionIdleTimer=null;function startSessionIdleWatch(){function reset(){clearTimeout(sessionIdleTimer);sessionIdleTimer=setTimeout(async function(){await supa.auth.signOut();alert('Byl jsi odhlášen kvůli 2 hodinám nečinnosti.');window.location.href='wms_dashboard.html';},SESSION_IDLE_MS);}['click','keydown','touchstart','scroll','mousemove'].forEach(function(evt){document.addEventListener(evt,reset,{passive:true});});reset();}
async function onLoggedIn(user){document.getElementById('session-check').style.display='none';currentUser=user;var prof=await supa.from('profiles').select('*').eq('id',user.id).single();if(!prof.data){alert('Tento účet už není platný. Kontaktuj administrátora.');await supa.auth.signOut();window.location.href='wms_dashboard.html';return;}currentProfile=prof.data;if(currentProfile.is_active===false){alert('Tento účet byl deaktivován. Kontaktuj administrátora.');await supa.auth.signOut();window.location.href='wms_dashboard.html';return;}var allowed=currentProfile.allowed_apps;if(currentProfile.role!=='admin'&&Array.isArray(allowed)&&allowed.indexOf('wms')===-1){alert('Nemáš přístup do PRG WMS. Kontaktuj administrátora.');await supa.auth.signOut();window.location.href='wms_dashboard.html';return;}document.getElementById('sidebar-user-name').textContent=currentProfile.name||user.email;var rb=document.getElementById('sidebar-user-role');rb.textContent=currentProfile.role==='admin'?'Admin':'User';rb.className=currentProfile.role==='admin'?'badge badge-orange':'badge badge-gray';document.querySelectorAll('.admin-only').forEach(function(el){el.style.display=currentProfile.role==='admin'?'flex':'none';});document.getElementById('auth-screen').style.display='none';document.getElementById('app').style.display='block';(async function(){try{if(window.PRG_DC)await PRG_DC.init(supa,currentProfile);}catch(e){console.warn('DC',e);}if(typeof afterLogin==='function')afterLogin();})();startSessionIdleWatch();}
async function doLogout(){await supa.auth.signOut();window.location.href='wms_dashboard.html';}
function go(u){window.location.href=u;}
function toggleSidebar(){var sb=document.getElementById('sidebar'),ov=document.getElementById('sidebar-overlay'),o=sb.classList.toggle('open');ov.style.display=o?'block':'none';}
var _tt;function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){e.classList.remove('show');},2800);}
function closeModal(id){document.getElementById(id).style.display='none';}
function fmt(dt){return new Date(dt).toLocaleString('cs-CZ');}
function fmtD(dt){return new Date(dt).toLocaleDateString('cs-CZ');}
supa.auth.getSession().then(function(res){
  if(res.data&&res.data.session){onLoggedIn(res.data.session.user);}
  else{window.location.href='wms_dashboard.html';}
});

var data=[],whs=[],clients=[],editId=null;
async function afterLogin(){
  var [wr,cr]=await Promise.all([supa.from('warehouses').select('id,name,code').order('name'),supa.from('clients').select('id,name').order('name')]);
  whs=(window.PRG_DC&&PRG_DC.list().length?PRG_DC.list():wr.data)||[];clients=cr.data||[];
  var fwh=document.getElementById('f-wh'),fwh2=document.getElementById('f-wh2');
  whs.forEach(function(w){fwh.innerHTML+='<option value="'+w.id+'">'+(w.code||w.name)+'</option>';fwh2.innerHTML+='<option value="'+w.id+'">'+(w.code||w.name)+'</option>';});
  var fcl=document.getElementById('f-cl'),fcl2=document.getElementById('f-cl2');
  clients.forEach(function(c){fcl.innerHTML+='<option value="'+c.id+'">'+c.name+'</option>';fcl2.innerHTML+='<option value="'+c.id+'">'+c.name+'</option>';});
  load();
}
var stockMap={};
async function loadStockSums(){
  stockMap={};var from=0;
  try{while(true){
    var q=supa.from('v_sku_stock').select('dc_id,sku_key,units_total').range(from,from+999);if(window.PRG_DC)q=PRG_DC.apply(q,'dc_id');
    var r=await q;if(r.error){stockMap=null;return;}
    var d=r.data||[];d.forEach(function(x){stockMap[x.dc_id+'|'+x.sku_key]=Number(x.units_total)||0;});
    if(d.length<1000)break;from+=1000;}
  }catch(e){stockMap=null;}
}
function stockOf(i){if(stockMap===null)return null;var k=String(i.sku||'').trim().toUpperCase();if(i.warehouse_id!=null)return stockMap[i.warehouse_id+'|'+k]||0;var t=0,f=false;Object.keys(stockMap).forEach(function(x){if(x.slice(x.indexOf('|')+1)===k){t+=stockMap[x];f=true;}});return f?t:0;}
async function load(){var q=supa.from('stock_items').select('*,warehouses(name,code),clients(name)').order('sku');if(window.PRG_DC)q=PRG_DC.apply(q,'warehouse_id');var res=await q;data=res.data||[];await loadStockSums();render(data);}
function render(d){
  var tb=document.getElementById('tbody');
  if(!d.length){tb.innerHTML='<tr class="empty-row"><td colspan="11">Žádné SKU</td></tr>';return;}
  tb.innerHTML=d.map(function(i){
    var wn=(i.warehouses&&(i.warehouses.code||i.warehouses.name))||'–';
    var cn=(i.clients&&i.clients.name)||'–';
    var st=stockOf(i);
    var sb=st===null?'–':(i.min_stock>0&&st<=i.min_stock?'<span class="badge badge-orange">'+st+'</span>':'<span class="badge badge-green">'+st+'</span>');
    var num=function(v){return v==null||v===''?'–':v;};
    return '<tr>'
      +'<td><a href="wms_item.html?id='+i.id+'" style="font-weight:700;color:var(--accent);text-decoration:none">'+i.sku+'</a></td>'
      +'<td>'+(i.description||'–')+'</td>'
      +'<td style="font-family:\'JetBrains Mono\',monospace;font-size:11px">'+(i.ean||'–')+'</td>'
      +'<td>'+(i.category?'<span class="badge badge-blue">'+i.category+'</span>':'–')+'</td>'
      +'<td>'+cn+'</td><td>'+wn+'</td>'
      +'<td style="text-align:right">'+num(i.units_per_pallet)+'</td>'
      +'<td>'+(i.pallet_type||'–')+'</td>'
      +'<td style="text-align:right">'+(i.min_stock||'–')+'</td>'
      +'<td style="text-align:right">'+sb+'</td>'
      +'<td><div style="display:flex;gap:4px">'
        +'<a href="wms_item.html?id='+i.id+'" class="btn btn-secondary btn-sm">Detail</a>'
        +'<button class="btn btn-secondary btn-sm" onclick="edit('+i.id+')">✏️</button>'
        +'<button class="btn btn-danger btn-sm" onclick="del('+i.id+')">🗑</button>'
      +'</div></td></tr>';}).join('');
}
function filter(){var q=document.getElementById('search').value.toLowerCase();var wid=document.getElementById('f-wh').value;var cid=document.getElementById('f-cl').value;render(data.filter(function(i){return(!q||i.sku.toLowerCase().includes(q)||(i.description&&i.description.toLowerCase().includes(q))||(i.ean&&i.ean.toLowerCase().includes(q))||(i.category&&i.category.toLowerCase().includes(q)))&&(!wid||String(i.warehouse_id)===wid)&&(!cid||String(i.client_id)===cid);}));}
function openModal(item){
  editId=item?item.id:null;
  document.getElementById('modal-title').textContent=item?'Upravit SKU':'Nové SKU';
  document.getElementById('f-sku').value=item?item.sku:'';
  document.getElementById('f-ean').value=item?(item.ean||''):'';
  document.getElementById('f-cat').value=item?(item.category||''):'';
  document.getElementById('f-sup').value=item?(item.supplier||''):'';
  document.getElementById('f-price').value=item?(item.price||''):'';
  document.getElementById('f-min').value=item?(item.min_stock||0):0;
  document.getElementById('f-desc').value=item?(item.description||''):'';
  document.getElementById('f-upp').value=item&&item.units_per_pallet!=null?item.units_per_pallet:'';
  document.getElementById('f-ptype').value=item?(item.pallet_type||''):'';
  document.getElementById('f-pw').value=item&&item.pallet_width_mm!=null?item.pallet_width_mm:'';
  document.getElementById('f-ph').value=item&&item.pallet_height_mm!=null?item.pallet_height_mm:'';
  document.getElementById('f-pkg').value=item&&item.pallet_weight_kg!=null?item.pallet_weight_kg:'';
  document.getElementById('f-photo').value=item?(item.photo_url||''):'';
  document.getElementById('f-notes').value=item?(item.notes||''):'';
  document.getElementById('f-wh2').value=item?(item.warehouse_id||''):((window.PRG_DC&&PRG_DC.currentId()!=null)?PRG_DC.currentId():'');
  document.getElementById('f-cl2').value=item?(item.client_id||''):'';
  document.getElementById('modal').style.display='flex';
}
function edit(id){openModal(data.find(function(i){return i.id===id;}));}
async function save(){
  var sku=document.getElementById('f-sku').value.trim();if(!sku){toast('⚠️ Zadej SKU');return;}
  var iv=function(id){var v=parseInt(document.getElementById(id).value);return isNaN(v)?null:v;};
  var fv=function(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?null:v;};
  var p={sku,ean:document.getElementById('f-ean').value.trim()||null,description:document.getElementById('f-desc').value.trim()||null,category:document.getElementById('f-cat').value.trim()||null,supplier:document.getElementById('f-sup').value.trim()||null,price:parseFloat(document.getElementById('f-price').value)||null,min_stock:parseInt(document.getElementById('f-min').value)||0,units_per_pallet:iv('f-upp'),pallet_type:document.getElementById('f-ptype').value.trim()||null,pallet_width_mm:iv('f-pw'),pallet_height_mm:iv('f-ph'),pallet_weight_kg:fv('f-pkg'),photo_url:document.getElementById('f-photo').value.trim()||null,notes:document.getElementById('f-notes').value.trim()||null,warehouse_id:parseInt(document.getElementById('f-wh2').value)||null,client_id:parseInt(document.getElementById('f-cl2').value)||null};
  if(!editId){p.quantity=0;p.created_by=currentUser.id;}
  var res=editId?await supa.from('stock_items').update(p).eq('id',editId):await supa.from('stock_items').insert(p);
  if(res.error){toast('❌ '+res.error.message);return;}
  toast(editId?'✅ SKU uloženo':'✅ SKU vytvořeno');closeModal('modal');load();
}
async function del(id){if(!confirm('Smazat SKU?'))return;await supa.from('stock_items').delete().eq('id',id);toast('🗑 Smazáno');load();}

</script>
