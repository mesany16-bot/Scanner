<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#f0f2f5;--surface:#fff;--border:#e2e6ed;--accent:#0a7c4e;--accent-light:#e8f7f1;--danger:#c0392b;--danger-light:#fdecea;--warning:#e67e22;--warning-light:#fef3e8;--info:#2980b9;--info-light:#eaf4fb;--text:#1a1d27;--muted:#7a8090;--shadow:0 2px 12px rgba(0,0,0,0.07);--sidebar-w:220px;}
*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;transition:opacity 0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}.btn:active{opacity:0.8;}.btn-primary{background:var(--accent);color:#fff;}.btn-secondary{background:var(--bg);color:var(--muted);border:1.5px solid var(--border);}.btn-danger{background:var(--danger);color:#fff;}.btn-warning{background:var(--warning);color:#fff;}.btn-sm{padding:6px 12px;font-size:12px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}.badge-green{background:var(--accent-light);color:var(--accent);}.badge-orange{background:var(--warning-light);color:var(--warning);}.badge-red{background:var(--danger-light);color:var(--danger);}.badge-blue{background:var(--info-light);color:var(--info);}.badge-gray{background:#f0f2f5;color:var(--muted);}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:20px;}.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}.card-header h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13px;}thead{background:#f8f9fb;}th{padding:9px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;}td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}tbody tr:last-child td{border-bottom:none;}tbody tr:hover{background:#fafbfc;}.empty-row td{text-align:center;color:var(--muted);padding:28px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}.form-row.single{grid-template-columns:1fr;}.form-row.triple{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:5px;}.form-group label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;background:#fff;}.form-group input:focus,.form-group select:focus{border-color:var(--accent);}.form-group textarea{resize:vertical;min-height:70px;}
.form-section{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:#0a7c4e;display:flex;flex-direction:column;z-index:50;transition:transform 0.25s ease;}.sidebar-logo{padding:20px 18px 14px;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:1.5px;border-bottom:1px solid rgba(255,255,255,0.15);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;}.sidebar-logo span{font-size:11px;font-weight:400;opacity:0.7;width:100%;letter-spacing:0;}#sidebar-close-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:0.8;display:none;}nav{flex:1;padding:10px 0;overflow-y:auto;}.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;color:rgba(255,255,255,0.75);cursor:pointer;font-size:14px;font-weight:500;transition:background 0.15s,color 0.15s;border-left:3px solid transparent;}.nav-item:hover{background:rgba(255,255,255,0.1);color:#fff;}.nav-item.active{background:rgba(255,255,255,0.15);color:#fff;border-left-color:#fff;}.nav-icon{font-size:17px;width:22px;text-align:center;}.sidebar-user{padding:12px 18px;border-top:1px solid rgba(255,255,255,0.15);font-size:12px;color:rgba(255,255,255,0.7);display:flex;flex-direction:column;gap:4px;}.sidebar-user strong{color:#fff;font-size:13px;}.sidebar-user button{background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:11px;margin-top:4px;}
#main{margin-left:var(--sidebar-w);min-height:100vh;}.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);position:sticky;top:0;z-index:40;}.topbar h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;flex:1;}.topbar-actions{display:flex;gap:8px;align-items:center;}.hamburger-btn{display:inline-flex;align-items:center;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:4px 8px;margin-right:4px;border-radius:6px;}.content{padding:24px;}#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:49;}
.back-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;}.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.items-table td input,.items-table td select{padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;width:100%;outline:none;font-family:'Inter',sans-serif;}
#toast{position:fixed;bottom:24px;right:24px;background:#1a1d27;color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;}#toast.show{opacity:1;}
@media(min-width:901px){.hamburger-btn{display:none;}#sidebar-close-btn{display:none !important;}}
@media(max-width:900px){:root{--sidebar-w:0px;}#sidebar{transform:translateX(-220px);width:220px;}#sidebar.open{transform:translateX(0);}#sidebar-close-btn{display:block !important;}#main{margin-left:0;}.content{padding:14px;}.topbar{padding:11px 14px;}}
/* mobilní zobrazení – sjednoceno s Inventory Tool */
@media(max-width:900px){
body{overflow-x:hidden;}
#main{min-width:0;max-width:100%;}

.stat-grid>*,.two-col>*{min-width:0;}
.form-row{grid-template-columns:1fr !important;}
}
</style></head><body>
<div id="session-check" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a7c4e,#075c3a)"><div style="color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;opacity:0.85;">Načítám…</div></div><div id="auth-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a7c4e,#075c3a)"><div style="background:#fff;border-radius:16px;padding:36px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.2)"><h1 style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:#0a7c4e;margin-bottom:4px">📦 PRG WMS</h1><p style="font-size:13px;color:#7a8090;margin-bottom:20px">Warehouse Management System</p><div id="auth-msg" style="font-size:13px;color:#c0392b;min-height:18px;margin-bottom:8px"></div><form id="login-form" method="post" action="#" autocomplete="on" onsubmit="event.preventDefault();doLogin();" style="margin:0"><input id="login-email" type="email" placeholder="E-mail" style="width:100%;padding:11px 14px;margin-bottom:10px;border:1.5px solid #e2e6ed;border-radius:8px;font-size:14px;outline:none" name="username" autocomplete="username"><input id="login-pass" type="password" placeholder="Heslo" style="width:100%;padding:11px 14px;margin-bottom:14px;border:1.5px solid #e2e6ed;border-radius:8px;font-size:14px;outline:none" name="password" autocomplete="current-password"><button type="submit" style="width:100%;padding:12px;background:#0a7c4e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">Přihlásit se</button></form></div></div>
<div id="app" style="display:none">
  <div id="sidebar"><div class="sidebar-logo">PRG WMS<span>Warehouse Management</span><button onclick="toggleSidebar()" id="sidebar-close-btn">&#x2715;</button></div>
  <nav id="wms-nav" data-active="portal"></nav>

  <div id="main">
<div class="topbar"><button class="hamburger-btn" onclick="toggleSidebar()">&#9776;</button><h2>🏢 Klientský portál</h2><div class="topbar-actions"><button class="btn btn-secondary btn-sm" onclick="load()">↻ Obnovit</button></div></div>
<div class="content" style="max-width:1200px;margin:0 auto">
<style>#sidebar,.hamburger-btn,#sidebar-overlay{display:none!important}#main{margin-left:0!important}.pt-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}.pt-tab{padding:9px 16px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}.pt-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}</style>
<div id="pt-admin" style="display:none;margin-bottom:12px" class="card"><div style="padding:10px 14px;font-size:13px">👁 Náhled portálu jako klient: <select id="pt-client" onchange="pick()" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px"></select> <span style="color:var(--muted)">(tuhle volbu vidí jen admin)</span></div></div>
<div class="pt-tabs"><button class="pt-tab on" data-t="home" onclick="tab('home')">🏠 Přehled</button><button class="pt-tab" data-t="stock" onclick="tab('stock')">📦 Zásoby</button><button class="pt-tab" data-t="rcpt" onclick="tab('rcpt')">📥 Příjmy</button><button class="pt-tab" data-t="dlv" onclick="tab('dlv')">📤 Výdeje</button><button class="pt-tab" data-t="exc" onclick="tab('exc')">⚠️ Výjimky</button><button class="pt-tab" data-t="temp" onclick="tab('temp')">🌡️ Teploty</button><button class="pt-tab" data-t="rep" onclick="tab('rep')">📑 Reporty</button></div>
<div id="tab-home"><div id="pt-kpi" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px"></div></div>
<div id="tab-stock" style="display:none"><div class="card"><div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border)"><input id="st-q" placeholder="Hledat SKU / popis / LOT…" oninput="stockRender()" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;flex:1;min-width:160px"><button class="btn btn-secondary btn-sm" onclick="stockX()">📊 XLSX</button></div>
<div style="overflow-x:auto"><table><thead><tr><th>SKU</th><th>Popis</th><th>Celkem</th><th>Dostupné</th><th>Rezervováno</th><th>Palet</th><th>Nejbližší expirace</th></tr></thead><tbody id="st-body"></tbody></table></div></div></div>
<div id="tab-exc" style="display:none"><div class="card"><div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border)"><select id="ex-st" onchange="excLoad()" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px"><option value="active">Otevřené + řeší se</option><option value="">Všechny</option><option value="done">Vyřešené</option></select></div><div id="ex-out" style="padding:12px 16px"></div></div></div>
<div id="tab-rcpt" style="display:none"><div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Číslo</th><th>Dodavatel</th><th>Očekáváno</th><th>Stav</th><th>Průběh</th></tr></thead><tbody id="r-body"></tbody></table></div></div></div>
<div id="tab-dlv" style="display:none"><div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Číslo</th><th>Plán</th><th>Stav</th><th>Průběh</th><th>Odesláno</th><th>SPZ / plomba</th></tr></thead><tbody id="d-body"></tbody></table></div></div></div>
<div id="tab-rep" style="display:none"><div class="card"><div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;border-bottom:1px solid var(--border)">
<select id="pr-code" onchange="prPar()" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px"></select>
<span id="pr-per"><input type="date" id="pr-from" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px"> – <input type="date" id="pr-to" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px"></span>
<button class="btn btn-primary btn-sm" onclick="prRun()">▶ Zobrazit</button><button class="btn btn-secondary btn-sm" onclick="prX()">📊 XLSX</button><button class="btn btn-secondary btn-sm" onclick="prMonth()">🗓 Měsíční report (PDF)</button></div>
<div id="pr-sum" style="padding:8px 16px;font-size:12.5px;color:var(--muted)"></div><div style="overflow:auto;max-height:65vh"><table><thead id="pr-head"></thead><tbody id="pr-body"></tbody></table></div></div></div>
<div id="tab-temp" style="display:none"><div class="card"><div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border)"><input type="date" id="t-from" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px"><input type="date" id="t-to" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px"><button class="btn btn-primary btn-sm" onclick="tempRep()">Report</button><button class="btn btn-secondary btn-sm" onclick="window.print()">🖨 Tisk</button></div><div id="t-out" style="padding:16px"></div></div></div>
</div>
</div>
</div>
<div id="toast"></div>
<script>
var SUPA_URL="https://ujvqanqqhmnfxsfeqixc.supabase.co";var SUPA_KEY="sb_publishable_5o19BnZUEi8j-rU5DDAgBA_HwKB7V-v";
var supa=supabase.createClient(SUPA_URL,SUPA_KEY);
var currentUser=null,currentProfile=null;
async function doLogin(){var email=document.getElementById('login-email').value.trim();var pass=document.getElementById('login-pass').value;if(!email||!pass){document.getElementById('auth-msg').textContent='Vyplňte pole';return;}document.getElementById('auth-msg').textContent='Přihlašování…';var res=await supa.auth.signInWithPassword({email,password:pass});if(res.error){document.getElementById('auth-msg').textContent='Chyba: '+res.error.message;return;}try{if(window.PasswordCredential&&navigator.credentials){navigator.credentials.store(new PasswordCredential({id:email,password:pass})).catch(function(){});}}catch(e){}await onLoggedIn(res.data.user);}
// idle logout
var SESSION_IDLE_MS=2*60*60*1000;var sessionIdleTimer=null;function startSessionIdleWatch(){function reset(){clearTimeout(sessionIdleTimer);sessionIdleTimer=setTimeout(async function(){await supa.auth.signOut();alert('Byl jsi odhlášen kvůli 2 hodinám nečinnosti.');window.location.href='wms_dashboard.html';},SESSION_IDLE_MS);}['click','keydown','touchstart','scroll','mousemove'].forEach(function(evt){document.addEventListener(evt,reset,{passive:true});});reset();}
async function onLoggedIn(user){document.getElementById('session-check').style.display='none';currentUser=user;var prof=await supa.from('profiles').select('*').eq('id',user.id).single();if(!prof.data){alert('Tento účet už není platný. Kontaktuj administrátora.');await supa.auth.signOut();window.location.href='wms_dashboard.html';return;}currentProfile=prof.data;if(currentProfile.is_active===false){alert('Tento účet byl deaktivován. Kontaktuj administrátora.');await supa.auth.signOut();window.location.href='wms_dashboard.html';return;}document.getElementById('sidebar-user-name').textContent=currentProfile.name||user.email;var rb=document.getElementById('sidebar-user-role');rb.textContent=currentProfile.role==='admin'?'Admin':'User';rb.className=currentProfile.role==='admin'?'badge badge-orange':'badge badge-gray';document.querySelectorAll('.admin-only').forEach(function(el){el.style.display=currentProfile.role==='admin'?'flex':'none';});document.getElementById('auth-screen').style.display='none';document.getElementById('app').style.display='block';(async function(){try{if(window.PRG_DC)await PRG_DC.init(supa,currentProfile);}catch(e){console.warn('DC',e);}if(typeof afterLogin==='function')afterLogin();})();startSessionIdleWatch();}
async function doLogout(){await supa.auth.signOut();window.location.href='wms_dashboard.html';}
function go(u){window.location.href=u;}
function toggleSidebar(){var sb=document.getElementById('sidebar'),ov=document.getElementById('sidebar-overlay'),o=sb.classList.toggle('open');ov.style.display=o?'block':'none';}
var _tt;function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){e.classList.remove('show');},2800);}
function closeModal(id){document.getElementById(id).style.display='none';}
function fmtD(dt){return new Date(dt).toLocaleDateString('cs-CZ');}
supa.auth.getSession().then(function(res){if(res.data&&res.data.session){onLoggedIn(res.data.session.user);}else{window.location.href='wms_dashboard.html';}});

var CID=null,STOCK=[],AGG=[];
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nf(v,d){return v==null?'–':Number(v).toLocaleString('cs-CZ',{maximumFractionDigits:d==null?1:d});}
function dt(v){return v?new Date(v).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'–';}
async function afterLogin(){
  var isAdm=currentProfile.role==='admin';
  if(currentProfile.role!=='client'&&!isAdm){window.location.href='wms_dashboard.html';return;}
  if(isAdm){var cl=(await supa.from('clients').select('id,name').order('name')).data||[];document.getElementById('pt-admin').style.display='';document.getElementById('pt-client').innerHTML=cl.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('');CID=cl.length?cl[0].id:null;}
  else CID=currentProfile.client_id;
  if(!CID){document.getElementById('pt-kpi').innerHTML='<div class="card" style="padding:16px">Účet není přiřazený ke klientovi – kontaktuj Expeditors.</div>';return;}
  var n=new Date(),f=new Date(n.getFullYear(),n.getMonth(),1);document.getElementById('t-from').value=f.toISOString().slice(0,10);document.getElementById('t-to').value=n.toISOString().slice(0,10);
  var t='home';try{t=localStorage.getItem('prg_pt_tab')||'home';}catch(e){}tab(t);
}
function pick(){CID=Number(document.getElementById('pt-client').value);load();}
function tab(t){try{localStorage.setItem('prg_pt_tab',t);}catch(e){}['home','stock','rcpt','dlv','exc','temp','rep'].forEach(function(x){document.getElementById('tab-'+x).style.display=x===t?'':'none';});document.querySelectorAll('.pt-tab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t);});load();}
function cur(){var t='home';try{t=localStorage.getItem('prg_pt_tab')||'home';}catch(e){}return t;}
async function load(){var t=cur();var cn=(await supa.from('clients').select('name').eq('id',CID).maybeSingle()).data;document.querySelector('.topbar h2').textContent='🏢 '+((cn&&cn.name)||'Klientský portál');
  if(t==='home'||t==='stock')await stockLoad();if(t==='home')home();if(t==='rcpt')rcpt();if(t==='dlv')dlv();if(t==='exc')excLoad();if(t==='temp'&&!document.getElementById('t-out').innerHTML)tempRep();if(t==='rep')prInit();}
async function stockLoad(){var out=[],from=0;while(true){var r=await supa.from('stock_balances').select('*').eq('client_id',CID).gt('units_total',0).range(from,from+999);if(r.error)break;out=out.concat(r.data||[]);if((r.data||[]).length<1000)break;from+=1000;}STOCK=out;
  var g={};STOCK.forEach(function(b){var k=b.sku;var a=g[k]=g[k]||{sku:k,desc:b.description||'',total:0,avail:0,comm:0,lpns:{},exp:null};a.total+=Number(b.units_total);a.avail+=Number(b.units_available);a.comm+=Number(b.units_committed);a.lpns[b.lpn||('i'+b.id)]=1;if(b.expiry_date&&(!a.exp||b.expiry_date<a.exp))a.exp=b.expiry_date;if(!a.desc&&b.description)a.desc=b.description;});
  AGG=Object.keys(g).sort().map(function(k){var a=g[k];a.pal=Object.keys(a.lpns).length;return a;});if(cur()==='stock')stockRender();}
