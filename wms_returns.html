<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vratky – PRG WMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wms_nav.js"></script>
<script src="wms_dc.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#f0f2f5;--surface:#fff;--border:#e2e6ed;--accent:#0a7c4e;--accent-light:#e8f7f1;--danger:#c0392b;--danger-light:#fdecea;--warning:#e67e22;--warning-light:#fef3e8;--info:#2980b9;--info-light:#eaf4fb;--text:#1a1d27;--muted:#7a8090;--shadow:0 2px 12px rgba(0,0,0,0.07);--sidebar-w:220px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;transition:opacity 0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn:active{opacity:0.8;}.btn-primary{background:var(--accent);color:#fff;}.btn-secondary{background:var(--bg);color:var(--muted);border:1.5px solid var(--border);}.btn-danger{background:var(--danger);color:#fff;}.btn-warning{background:var(--warning);color:#fff;}.btn-info{background:var(--info);color:#fff;}.btn-sm{padding:6px 12px;font-size:12px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-green{background:var(--accent-light);color:var(--accent);}.badge-orange{background:var(--warning-light);color:var(--warning);}.badge-red{background:var(--danger-light);color:var(--danger);}.badge-blue{background:var(--info-light);color:var(--info);}.badge-gray{background:#f0f2f5;color:var(--muted);}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:20px;}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-header h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead{background:#f8f9fb;}
th{padding:9px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}tbody tr:hover{background:#fafbfc;}
.empty-row td{text-align:center;color:var(--muted);padding:28px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-row.single{grid-template-columns:1fr;}.form-row.triple{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;background:#fff;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);}
.form-group textarea{resize:vertical;min-height:70px;}
.form-section{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:var(--surface);border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto;}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
.modal-body{padding:18px 22px;}.modal-footer{padding:12px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:#0a7c4e;display:flex;flex-direction:column;z-index:50;transition:transform 0.25s ease;}
.sidebar-logo{padding:20px 18px 14px;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:1.5px;border-bottom:1px solid rgba(255,255,255,0.15);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.sidebar-logo span{font-size:11px;font-weight:400;opacity:0.7;width:100%;letter-spacing:0;}
#sidebar-close-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:0.8;display:none;}
nav{flex:1;padding:10px 0;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;color:rgba(255,255,255,0.75);cursor:pointer;font-size:14px;font-weight:500;transition:background 0.15s,color 0.15s;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,0.1);color:#fff;}
.nav-item.active{background:rgba(255,255,255,0.15);color:#fff;border-left-color:#fff;}
.nav-icon{font-size:17px;width:22px;text-align:center;}
.sidebar-user{padding:12px 18px;border-top:1px solid rgba(255,255,255,0.15);font-size:12px;color:rgba(255,255,255,0.7);display:flex;flex-direction:column;gap:4px;}
.sidebar-user strong{color:#fff;font-size:13px;}
.sidebar-user button{background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:11px;margin-top:4px;}
#main{margin-left:var(--sidebar-w);min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);position:sticky;top:0;z-index:40;}
.topbar h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;flex:1;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.hamburger-btn{display:inline-flex;align-items:center;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:4px 8px;margin-right:4px;border-radius:6px;}
.content{padding:24px;}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:49;}
#toast{position:fixed;bottom:24px;right:24px;background:#1a1d27;color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
#toast.show{opacity:1;}
.back-btn{background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
@media(min-width:901px){.hamburger-btn{display:none;}#sidebar-close-btn{display:none !important;}}
@media(max-width:900px){:root{--sidebar-w:0px;}#sidebar{transform:translateX(-220px);width:220px;}#sidebar.open{transform:translateX(0);}#sidebar-close-btn{display:block !important;}#main{margin-left:0;}.content{padding:14px;}.topbar{padding:11px 14px;}}

/* mobilní zobrazení – sjednoceno s Inventory Tool */
@media(max-width:900px){
body{overflow-x:hidden;}
#main{min-width:0;max-width:100%;}
.content{padding:12px !important;min-width:0;max-width:100%;}
.card{min-width:0;max-width:100%;}
.topbar{flex-wrap:wrap;gap:8px;padding:10px 12px !important;}
.topbar h2{font-size:19px !important;min-width:0;flex:1 1 auto;}
.topbar-actions{flex-wrap:wrap;gap:6px;margin-left:auto;}
#last-refresh{display:none;}
#theme-popover{right:8px !important;max-width:calc(100vw - 16px);}
.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important;}
.two-col{grid-template-columns:minmax(0,1fr) !important;}
.stat-grid>*,.two-col>*{min-width:0;}
.form-row{grid-template-columns:1fr !important;}
}

.sf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:12px 16px;}
.sf-grid label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.sf-grid input,.sf-grid select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#fff;font-family:inherit;}
.sf-grid input:focus,.sf-grid select:focus{border-color:var(--accent);}
.sf-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-top:1px solid var(--border);background:#fafbfc;}
.sf-bar .sf-info{flex:1;min-width:160px;font-size:12px;color:var(--muted);}
.sf-quick{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 0;}
.sf-quick button{padding:5px 11px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
.sf-quick button:hover{border-color:var(--accent);color:var(--accent);}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
th.sortable:hover{color:var(--accent);}
</style>
</head>
<body>
<div id="session-check" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a7c4e,#075c3a)">
  <div style="color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;opacity:0.85;">Načítám…</div>
</div>
<div id="auth-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a7c4e,#075c3a)">
  <div style="background:#fff;border-radius:16px;padding:36px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.2)">
    <h1 style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:#0a7c4e;margin-bottom:4px">📦 PRG WMS</h1>
    <p style="font-size:13px;color:#7a8090;margin-bottom:20px">Warehouse Management System</p>
    <div id="auth-msg" style="font-size:13px;color:#c0392b;min-height:18px;margin-bottom:8px"></div>
    <form id="login-form" method="post" action="#" autocomplete="on" onsubmit="event.preventDefault();doLogin();" style="margin:0"><input id="login-email" type="email" placeholder="E-mail" style="width:100%;padding:11px 14px;margin-bottom:10px;border:1.5px solid #e2e6ed;border-radius:8px;font-size:14px;outline:none" name="username" autocomplete="username">
    <input id="login-pass" type="password" placeholder="Heslo" style="width:100%;padding:11px 14px;margin-bottom:14px;border:1.5px solid #e2e6ed;border-radius:8px;font-size:14px;outline:none" name="password" autocomplete="current-password">
    <button type="submit" style="width:100%;padding:12px;background:#0a7c4e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">Přihlásit se</button></form>
  </div>
</div>
<div id="app" style="display:none">
  <div id="sidebar">
    <div class="sidebar-logo">PRG WMS<span>Warehouse Management</span><button onclick="toggleSidebar()" id="sidebar-close-btn">✕</button></div>
    <nav id="wms-nav" data-active="returns"></nav>
    <div class="sidebar-user">
      <strong id="sidebar-user-name">–</strong>
      <span id="sidebar-user-role" class="badge badge-gray"></span>
      <button onclick="doLogout()">Odhlásit se</button>
    </div>
  </div>
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div id="main">
    
<div class="topbar"><button class="hamburger-btn" onclick="toggleSidebar()">☰</button><h2>↩️ Vratky</h2><div class="topbar-actions"><button class="btn btn-primary btn-sm" id="btn-new" onclick="openNew()">+ Nová vratka</button></div></div>
<div class="content">
  <div class="card">
    <div class="sf-grid">
      <div><label>Hledat</label><input id="search" type="text" placeholder="RMA, výdejka, klient, důvod…" oninput="render()"></div>
      <div><label>Stav</label><select id="f-st" onchange="render()"><option value="">Všechny</option><option value="open">Čeká na příjem</option><option value="receiving">Přijímá se</option><option value="done">Hotové</option></select></div>
      <div><label>Za posledních</label><select id="f-days" onchange="load()"><option value="30">30 dní</option><option value="90" selected>90 dní</option><option value="365">rok</option><option value="3650">vše</option></select></div>
    </div>
    <div class="sf-bar"><span class="sf-info" id="sf-info">Načítám…</span>
      <span style="font-size:12px;color:var(--muted)">Vratka se přijímá na scanneru jako příjem – výchozí stav zboží je karanténa, dokud ho někdo nezkontroluje.</span></div>
    <div style="overflow-x:auto">
    <table><thead><tr><th>Vratka</th><th>K výdejce</th><th>Klient</th><th>Důvod</th><th style="text-align:right">Ohlášeno</th><th style="text-align:right">Přijato</th><th>Stav</th><th>Založeno</th></tr></thead>
    <tbody id="tbody"><tr class="empty-row"><td colspan="8">Načítám…</td></tr></tbody></table>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-new" style="display:none"><div class="modal-box" style="max-width:760px">
  <div class="modal-header"><h3>Nová vratka</h3><button class="modal-close" onclick="closeModal('modal-new')">✕</button></div>
  <div class="modal-body">
    <div class="form-row"><div class="form-group"><label>Číslo odeslané výdejky</label><input id="n-del" placeholder="např. VYD-2026-0012" onkeydown="if(event.key==='Enter')findDel()"></div>
      <div class="form-group" style="justify-content:flex-end"><button class="btn btn-secondary" onclick="findDel()">🔍 Najít</button></div></div>
    <div id="n-info" style="font-size:13px;color:var(--muted);margin-bottom:10px"></div>
    <div id="n-lines"></div>
    <div class="form-row"><div class="form-group"><label>Důvod vratky</label><select id="n-reason">
      <option value="">– vyber –</option><option>Poškozeno při přepravě</option><option>Špatně vychystáno</option><option>Zákazník odmítl převzít</option><option>Nadbytečné / storno objednávky</option><option>Reklamace kvality</option><option>Nedoručitelné</option><option>Jiné</option></select></div>
      <div class="form-group"><label>Poznámka</label><input id="n-note" placeholder="např. číslo reklamace zákazníka"></div></div>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('modal-new')">Zrušit</button><button class="btn btn-primary" id="n-save" onclick="saveNew()" disabled>↩️ Založit vratku</button></div>
</div></div>
  </div>
</div>
<div id="toast"></div>
<script>
var SUPA_URL="https://ujvqanqqhmnfxsfeqixc.supabase.co";
var SUPA_KEY="sb_publishable_5o19BnZUEi8j-rU5DDAgBA_HwKB7V-v";
var supa=supabase.createClient(SUPA_URL,SUPA_KEY);
var currentUser=null,currentProfile=null;
async function doLogin(){var email=document.getElementById('login-email').value.trim();var pass=document.getElementById('login-pass').value;if(!email||!pass){document.getElementById('auth-msg').textContent='⚠️ Vyplň e-mail a heslo';return;}document.getElementById('auth-msg').textContent='⏳ Přihlašuji…';var res=await supa.auth.signInWithPassword({email,password:pass});if(res.error){document.getElementById('auth-msg').textContent='❌ '+res.error.message;return;}try{if(window.PasswordCredential&&navigator.credentials){navigator.credentials.store(new PasswordCredential({id:email,password:pass})).catch(function(){});}}catch(e){}await onLoggedIn(res.data.user);}
// idle logout
var SESSION_IDLE_MS=2*60*60*1000;var sessionIdleTimer=null;function startSessionIdleWatch(){function reset(){clearTimeout(sessionIdleTimer);sessionIdleTimer=setTimeout(async function(){await supa.auth.signOut();alert('Byl jsi odhlášen kvůli 2 hodinám nečinnosti.');window.location.href='wms_dashboard.html';},SESSION_IDLE_MS);}['click','keydown','touchstart','scroll','mousemove'].forEach(function(evt){document.addEventListener(evt,reset,{passive:true});});reset();}
async function onLoggedIn(user){document.getElementById('session-check').style.display='none';currentUser=user;var prof=await supa.from('profiles').select('*').eq('id',user.id).single();if(!prof.data){alert('Tento účet už není platný. Kontaktuj administrátora.');await supa.auth.signOut();window.location.href='wms_dashboard.html';return;}currentProfile=prof.data;if(currentProfile.is_active===false){alert('Tento účet byl deaktivován. Kontaktuj administrátora.');await supa.auth.signOut();window.location.href='wms_dashboard.html';return;}var allowed=currentProfile.allowed_apps;if(currentProfile.role!=='admin'&&Array.isArray(allowed)&&allowed.indexOf('wms')===-1){alert('Nemáš přístup do PRG WMS. Kontaktuj administrátora.');await supa.auth.signOut();window.location.href='wms_dashboard.html';return;}document.getElementById('sidebar-user-name').textContent=currentProfile.name||user.email;var rb=document.getElementById('sidebar-user-role');rb.textContent=currentProfile.role==='admin'?'Admin':'User';rb.className=currentProfile.role==='admin'?'badge badge-orange':'badge badge-gray';document.querySelectorAll('.admin-only').forEach(function(el){el.style.display=currentProfile.role==='admin'?'flex':'none';});document.getElementById('auth-screen').style.display='none';document.getElementById('app').style.display='block';(async function(){try{if(window.PRG_DC)await PRG_DC.init(supa,currentProfile);}catch(e){console.warn('DC',e);}if(typeof afterLogin==='function')afterLogin();})();startSessionIdleWatch();}
async function doLogout(){await supa.auth.signOut();window.location.href='wms_dashboard.html';}
function go(u){window.location.href=u;}
function toggleSidebar(){var sb=document.getElementById('sidebar'),ov=document.getElementById('sidebar-overlay'),o=sb.classList.toggle('open');ov.style.display=o?'block':'none';}
var _tt;function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){e.classList.remove('show');},2800);}
function closeModal(id){document.getElementById(id).style.display='none';}
function fmt(dt){return new Date(dt).toLocaleString('cs-CZ');}
function fmtD(dt){return new Date(dt).toLocaleDateString('cs-CZ');}
supa.auth.getSession().then(function(res){
  if(res.data&&res.data.session){onLoggedIn(res.data.session.user);}
  else{window.location.href='wms_dashboard.html';}
});

var data=[],cur=null;
var ST={new:['Čeká na příjem','badge-orange'],arrived:['Dorazila','badge-orange'],receiving:['Přijímá se','badge-blue'],received:['Přijato','badge-blue'],putaway:['Zaskladňuje se','badge-blue'],done:['Hotovo','badge-green'],cancelled:['Zrušeno','badge-gray']};
function grp(s){return s==='done'?'done':(s==='new'||s==='arrived')?'open':s==='cancelled'?'x':'receiving';}
function escH(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nf(n){return Number(n||0).toLocaleString('cs-CZ');}
async function afterLogin(){
  if(currentProfile&&currentProfile.role==='client'){document.getElementById('btn-new').style.display='none';}
  await load();
  var p=new URLSearchParams(location.search).get('delivery');
  if(p){var d=await supa.from('deliveries').select('delivery_number').eq('id',p).single();if(d.data){openNew();document.getElementById('n-del').value=d.data.delivery_number;findDel();}}
}
async function load(){
  var since=new Date(Date.now()-Number(document.getElementById('f-days').value)*864e5).toISOString();
  var q=supa.from('receipts').select('id,receipt_number,status,return_reason,note,created_at,warehouse_id,return_delivery_id,clients(name),deliveries(delivery_number),receipt_items(quantity)').eq('receipt_type','return').gte('created_at',since).order('created_at',{ascending:false}).limit(2000);
  if(window.PRG_DC)q=PRG_DC.apply(q,'warehouse_id');
  var r=await q;
  if(r.error){document.getElementById('tbody').innerHTML='<tr class="empty-row"><td colspan="8">❌ '+escH(r.error.message)+'</td></tr>';return;}
  data=r.data||[];
  var ids=data.map(function(x){return x.id;}),got={};
  for(var i=0;i<ids.length;i+=200){var s=await supa.from('receipt_scans').select('receipt_id,qty').in('receipt_id',ids.slice(i,i+200));(s.data||[]).forEach(function(x){got[x.receipt_id]=(got[x.receipt_id]||0)+Number(x.qty||0);});}
  data.forEach(function(x){x.exp=(x.receipt_items||[]).reduce(function(a,y){return a+Number(y.quantity||0);},0);x.got=got[x.id]||0;});
  render();
}
function render(){
  var q=(document.getElementById('search').value||'').toLowerCase().trim(),st=document.getElementById('f-st').value;
  var rows=data.filter(function(x){if(st&&grp(x.status)!==st)return false;if(q){var h=[x.receipt_number,x.deliveries&&x.deliveries.delivery_number,x.clients&&x.clients.name,x.return_reason,x.note].join(' ').toLowerCase();if(h.indexOf(q)<0)return false;}return true;});
  var open=data.filter(function(x){return grp(x.status)==='open';}).length;
  document.getElementById('sf-info').innerHTML='<b>'+rows.length+'</b> vratek'+(open?' · <b style="color:var(--warning)">'+open+'</b> čeká na příjem':'');
  document.getElementById('tbody').innerHTML=rows.length?rows.map(function(x){var s=ST[x.status]||[x.status,'badge-gray'];
    var diff=x.got&&x.got!==x.exp;
    return '<tr><td><a href="wms_receipt.html?id='+x.id+'" style="color:var(--accent);font-weight:700;text-decoration:none">'+escH(x.receipt_number)+'</a></td>'
      +'<td>'+(x.return_delivery_id?'<a href="wms_delivery.html?id='+x.return_delivery_id+'" style="color:var(--info);text-decoration:none">'+escH(x.deliveries&&x.deliveries.delivery_number||'#'+x.return_delivery_id)+'</a>':'')+'</td>'
      +'<td>'+escH(x.clients&&x.clients.name||'')+'</td><td>'+escH(x.return_reason||'')+(x.note?'<div style="font-size:11px;color:var(--muted)">'+escH(x.note)+'</div>':'')+'</td>'
      +'<td style="text-align:right">'+nf(x.exp)+'</td><td style="text-align:right'+(diff?';color:var(--danger);font-weight:700':'')+'">'+(x.got?nf(x.got):'–')+'</td>'
      +'<td><span class="badge '+s[1]+'">'+s[0]+'</span></td><td style="white-space:nowrap">'+fmtD(x.created_at)+'</td></tr>';}).join('')
    :'<tr class="empty-row"><td colspan="8">Žádné vratky. Novou založíš tlačítkem „+ Nová vratka“ nebo z detailu odeslané výdejky.</td></tr>';
}
function openNew(){cur=null;['n-del','n-note'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('n-reason').value='';
  document.getElementById('n-info').textContent='Zadej číslo výdejky, ke které se zboží vrací.';document.getElementById('n-lines').innerHTML='';document.getElementById('n-save').disabled=true;
  document.getElementById('modal-new').style.display='flex';setTimeout(function(){document.getElementById('n-del').focus();},50);}
async function findDel(){
  var num=document.getElementById('n-del').value.trim();if(!num)return;
  var info=document.getElementById('n-info');info.textContent='Hledám…';document.getElementById('n-save').disabled=true;document.getElementById('n-lines').innerHTML='';
  var d=await supa.from('deliveries').select('id,delivery_number,status,shipped_at,ship_to_name,ship_to_city,customer_ref,clients(name)').ilike('delivery_number',num).limit(1);
  var del=d.data&&d.data[0];if(!del){info.innerHTML='❌ Výdejka '+escH(num)+' nenalezena';return;}
  if(['shipped','done','delivered'].indexOf(del.status)<0){info.innerHTML='❌ Výdejka '+escH(del.delivery_number)+' ještě nebyla odeslána (stav '+escH(del.status)+')';return;}
  var l=await supa.rpc('wms_return_lines',{p_delivery:del.id});
  if(l.error){info.innerHTML='❌ '+escH(l.error.message);return;}
  cur={d:del,lines:(l.data||[]).map(function(x){x.left=Number(x.shipped)-Number(x.returned);return x;})};
  info.innerHTML='<b>'+escH(del.delivery_number)+'</b> · '+escH(del.clients&&del.clients.name||'')+' · odesláno '+(del.shipped_at?fmtD(del.shipped_at):'')+(del.ship_to_name?' · '+escH(del.ship_to_name)+(del.ship_to_city?', '+escH(del.ship_to_city):''):'')+(del.customer_ref?' · ref. '+escH(del.customer_ref):'');
  if(!cur.lines.length){document.getElementById('n-lines').innerHTML='<p style="color:var(--muted)">Výdejka nemá žádné vychystané položky.</p>';return;}
  document.getElementById('n-lines').innerHTML='<table style="margin-bottom:14px"><thead><tr><th>SKU</th><th>LOT</th><th style="text-align:right">Odesláno</th><th style="text-align:right">Už vráceno</th><th style="width:120px">Vrací se (ks)</th></tr></thead><tbody>'
    +cur.lines.map(function(x,i){return '<tr><td><b>'+escH(x.sku)+'</b>'+(x.description?'<div style="font-size:11px;color:var(--muted)">'+escH(x.description)+'</div>':'')+'</td><td>'+escH(x.lot||'')+'</td><td style="text-align:right">'+nf(x.shipped)+'</td><td style="text-align:right">'+nf(x.returned)+'</td><td><input type="number" min="0" max="'+x.left+'" id="n-q'+i+'" '+(x.left>0?'':'disabled ')+'placeholder="0" style="width:100%;padding:7px 9px;border:1.5px solid var(--border);border-radius:7px"></td></tr>';}).join('')+'</tbody></table>'
    +'<div style="margin:-6px 0 12px"><button class="btn btn-secondary btn-sm" onclick="allBack()">Vrací se vše</button></div>';
  document.getElementById('n-save').disabled=false;
}
function allBack(){cur.lines.forEach(function(x,i){var e=document.getElementById('n-q'+i);if(e&&!e.disabled)e.value=x.left;});}
async function saveNew(){
  if(!cur)return;var lines=[],bad='';
  cur.lines.forEach(function(x,i){var v=Number(document.getElementById('n-q'+i).value||0);if(v>0){if(v>x.left)bad=x.sku+': max '+x.left;lines.push({sku:x.sku,lot:x.lot,qty:v});}});
  if(bad){toast('⚠️ '+bad);return;}if(!lines.length){toast('⚠️ Zadej vracené množství');return;}
  var reason=document.getElementById('n-reason').value;if(!reason){toast('⚠️ Vyber důvod vratky');return;}
  var b=document.getElementById('n-save');b.disabled=true;
  var r=await supa.rpc('wms_return_create',{p_delivery:cur.d.id,p_lines:lines,p_reason:reason,p_note:document.getElementById('n-note').value.trim()||null});
  b.disabled=false;
  if(r.error){toast('❌ '+r.error.message);return;}
  closeModal('modal-new');toast('✅ Vratka '+r.data.number+' založena – přijme se na scanneru v Příjmech');load();
}

</script>
</body>
